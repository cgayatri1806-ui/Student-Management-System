<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .header {
            background: #1f4e78;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 25px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 20px;
            width: 250px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-top: 0;
            color: #555;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
            color: #1f4e78;
            margin: 10px 0 0;
        }

        .section {
            background: white;
            margin-top: 25px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #1f4e78;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #163a5c;
        }

        .search {
            max-width: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1f4e78;
            color: white;
        }

        .delete-btn {
            background: #c0392b;
        }

        .edit-btn {
            background: #27ae60;
            margin-right: 5px;
        }

        @media (max-width: 700px) {
            .cards {
                flex-direction: column;
            }

            .card {
                width: 100%;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Student Management System</h1>
        <p>Manage students, courses and registrations</p>
    </div>

    <div class="container">

        <h2>Dashboard</h2>

        <div class="cards">

            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="card">
                <h3>Total Courses</h3>
                <p id="totalCourses">4</p>
            </div>

            <div class="card">
                <h3>Recent Registrations</h3>
                <p id="recentStudents">0</p>
            </div>

        </div>


        <div class="section">

            <h2>Add Student</h2>

            <form id="studentForm">
                <input type="hidden" id="studentId">

                <label>Student Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter student name"
                    required
                >

                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >

                <label>Phone</label>
                <input
                    type="text"
                    id="phone"
                    placeholder="Enter phone number"
                >

                <label>Course</label>

                <select id="course">
                    <option value="">Select Course</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Computer Applications">Computer Applications</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Data Science">Data Science</option>
                </select>

                <button type="submit">Add Student</button>

            </form>

        </div>


        <div class="section">

            <h2>Student Records</h2>

            <input
                class="search"
                type="text"
                id="search"
                placeholder="Search student..."
                onkeyup="searchStudents()"
            >

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                </tbody>

            </table>

        </div>

    </div>


    <script>

        /*
         * Backend URL will be connected after
         * Application Load Balancer setup.
         */
        const API_URL = "http://student-management-alb-104181828.ap-south-1.elb.amazonaws.com";

        let students = [];


        async function loadStudents() {

            try {

                const response = await fetch(API_URL + "/students");

                students = await response.json();

                displayStudents(students);

                document.getElementById("totalStudents").textContent =
                    students.length;

                document.getElementById("recentStudents").textContent =
                    students.length;

            } catch (error) {

                console.log("Backend not connected yet.");

            }

        }


        function displayStudents(data) {

            const table = document.getElementById("studentTable");

            table.innerHTML = "";

            data.forEach(student => {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.email}</td>
                    <td>${student.phone || ""}</td>
                    <td>${student.course || ""}</td>
                    <td>
                        <button
                            class="edit-btn"
                            onclick="editStudent(${student.id})">
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${student.id})">
                            Delete
                        </button>
                    </td>
                `;

                table.appendChild(row);

            });

        }


        document.getElementById("studentForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const studentId = document.getElementById("studentId").value;
            const student = {

                name: document.getElementById("name").value,

                email: document.getElementById("email").value,

                phone: document.getElementById("phone").value,

                course: document.getElementById("course").value

            };


            try {

                const response = await fetch(
                    studentId
                        ? API_URL + "/students/" + studentId
                        : API_URL + "/students",
                    {
                    method: studentId ? "PUT" : "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(student)

                });


                if (response.ok) {

                    alert(studentId ? "Student updated successfully!" : "Student added successfully!");

                    document.getElementById("studentForm").reset();
                    document.getElementById("studentId").value = "";

                    loadStudents();

                } else {

                    alert("Failed to add student.");

                }

            } catch (error) {

                alert("Backend is not connected yet.");

            }

        });


        async function deleteStudent(id) {

            if (!confirm("Delete this student?")) {
                return;
            }


            try {

                const response =
                    await fetch(API_URL + "/students/" + id, {
                        method: "DELETE"
                    });


                if (response.ok) {

                    alert("Student deleted successfully!");

                    loadStudents();

                }

            } catch (error) {

                alert("Backend is not connected yet.");

            }

        }


        function editStudent(id) {

            const student = students.find(s => s.id == id);

            if (!student) {
                return;
            }

            document.getElementById("name").value = student.name;
            document.getElementById("studentId").value = student.id;
            document.getElementById("email").value = student.email;
            document.getElementById("phone").value = student.phone || "";
            document.getElementById("course").value = student.course || "";


        }


        function searchStudents() {

            const search =
                document.getElementById("search").value.toLowerCase();

            const filtered =
                students.filter(student =>
                    student.name.toLowerCase().includes(search) ||
                    student.email.toLowerCase().includes(search) ||
                    (student.course || "").toLowerCase().includes(search)
                );

            displayStudents(filtered);

        }


        loadStudents();

    </script>

</body>
